name: Deploy to Cloud Run via WIF

on:
  push:
    branches:
      - main

env:
  PROJECT_ID: 'section31-509508'
  REGION: 'us-central1'
  SERVICE_NAME: 'devops-web-service'
  REPOSITORY: 'devops-repo'

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Step 1: Authenticate to Google Cloud using WIF
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          create_credentials_file: true

      # Step 2: Set up Google Cloud SDK CLI tool
      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      # Step 3: Explicitly configure Docker to use the GCP credentials
      - name: Authorize Docker to Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      # Step 4: Build and Push Container Image
      - name: Build and Push Container Image
        run: |
          IMAGE_TAG="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.SERVICE_NAME }}:${{ github.sha }}"
          docker build -t $IMAGE_TAG .
          docker push $IMAGE_TAG
          echo "IMAGE_URL=$IMAGE_TAG" >> $GITHUB_ENV

      # Step 5: Deploy to Cloud Run
      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE_NAME }}
          image: ${{ env.IMAGE_URL }}
          region: ${{ env.REGION }}
          flags: '--allow-unauthenticated'
